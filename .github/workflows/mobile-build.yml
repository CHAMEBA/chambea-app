name: Mobile test builds

on:
  workflow_dispatch:
  push:
    branches: [development/capacitor-mobile]
  pull_request:
    paths:
      - index.html
      - scripts/**
      - package*.json
      - capacitor.config.json
      - android/**
      - ios/**
      - .github/workflows/mobile-build.yml

permissions:
  contents: read

jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The hosted Ubuntu runner already includes Android SDK command-line tools.
      # Avoid attempting to install the obsolete SDK 'tools' package.
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Install pinned Firebase runtime and bundler
        run: npm install --no-save --package-lock=false firebase@10.14.1 esbuild@0.25.12
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate approved CHAMBEA app icon and splash assets
        run: |
          python -m pip install Pillow
          python scripts/generate-brand-assets.py
      - run: npx cap sync
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: chambea-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Direct .apk GitHub Release, avoiding sandbox link and Actions ZIP-only artifacts.
      # This is an unsigned-for-store DEBUG build, intended solely for user device testing.
      - name: Offer direct CHAMBEA V1 Android APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development/capacitor-mobile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='chambea-v1-android-pruebas'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'CHAMBEA V1 · Android para pruebas' --notes 'APK directo para pruebas en teléfonos Android. No es una versión firmada para Play Store. Los cobros son simulados y las reglas actualizadas de Firebase deben publicarse para la agenda y las recotizaciones.'
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk CHAMBEA_V1_ANDROID.apk
          gh release upload "$TAG" CHAMBEA_V1_ANDROID.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo 'Descarga directa: https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/CHAMBEA_V1_ANDROID.apk'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.*

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned Firebase runtime and bundler
        run: npm install --no-save --package-lock=false firebase@10.14.1 esbuild@0.25.12
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate approved CHAMBEA app icon and splash assets
        run: |
          python -m pip install Pillow
          python scripts/generate-brand-assets.py
      - run: npx cap sync
      - name: Build without distribution signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/chambea-ios"
          CODE_SIGNING_ALLOWED=NO build
