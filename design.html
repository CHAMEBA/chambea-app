function topbar(){return `<header class="top">${logo()}<div class="actions"><button class="headbutton alert" aria-label="Notificaciones" onclick="go('notifications')">${ico('bell')}</button><button class="headbutton" aria-label="Mi perfil" onclick="go('profile')">${ico('user')}</button></div></header>`}
function head(title){return `<div class="backrow"><button aria-label="Volver" onclick="back()">${ico('back')}</button><h1>${e(title)}</h1></div>`}
function section(t,action){return `<div class="section-title"><h2>${t}</h2>${action||''}</div>`}
function go(page,arg){if(S.page!==page)S.previous.push(S.page);S.page=page;if(arg!==undefined){if(page==='category')S.cat=arg;if(page==='provider')S.pro=arg;if(['job','quotes','tracking'].includes(page))S.jobid=arg;if(page==='chat')S.chat=arg};if(page==='post')S.step=1;render();window.scrollTo(0,0)}function back(){S.page=S.previous.pop()||'home';render();window.scrollTo(0,0)}function navigateMode(mode){data.mode=mode;save();S.previous=[];S.page=mode==='cliente'?'home':'proHome';render();window.scrollTo(0,0)}function nav(){let items=data.mode==='cliente'?[['home','Inicio','home'],['explore','Explorar','search'],['jobs','Solicitudes','file'],['messages','Mensajes','chat'],['profile','Perfil','user']]:[['proHome','Inicio','home'],['opportunities','Solicitudes','file'],['worklist','Mis trabajos','calendar'],['messages','Mensajes','chat'],['profile','Perfil','user']];const shown=!['welcome','auth'].includes(S.page);$('#bottom').classList.toggle('hide',!shown);$('#bottom').innerHTML=shown?items.map(([p,t,i])=>`<button aria-label="${t}" class="${S.page===p?'on':''}" onclick="go('${p}')">${ico(i)}<span>${t}</span></button>`).join(''):''}
function render(){const a=$('#app');a.className='content'+(['welcome','auth'].includes(S.page)?' onboarding':'');let m='';try{switch(S.page){case'welcome':m=welcome();break;case'auth':m=auth();break;case'home':m=home();break;case'explore':m=explore();break;case'category':m=category();break;case'provider':m=provider();break;case'post':m=post();break;case'jobs':m=jobs();break;case'job':m=job();break;case'quotes':m=quotes();break;case'tracking':m=tracking();break;case'messages':m=messages();break;case'chat':m=chat();break;case'profile':m=profile();break;case'proHome':m=proHome();break;case'opportunities':m=opportunities();break;case'worklist':m=worklist();break;case'wallet':m=wallet();break;case'notifications':m=notifications();break;default:m=home()}}catch(ex){console.error(ex);m=`<div class="area"><h2>Algo no se pudo mostrar</h2><button class="btn primary" onclick="go('home')">Volver al inicio</button></div>`}a.innerHTML=m;nav()}
function welcome(){return `<div class="welcome-page"><div class="welcome-photo"><div class="copy">${logo(205)}<h1>Tu hogar en<br><span class="orange">buenas manos</span></h1><p>Encuentra profesionales, solicita cotizaciones y organiza tus servicios desde un solo lugar.</p></div></div><div class="welcome-foot"><div class="welcomefeat"><div class="item">${ico('search')}Encuentra<br>servicios</div><div class="item">${ico('file')}Compara<br>cotizaciones</div><div class="item">${ico('calendar')}Organiza<br>tus trabajos</div></div><button class="btn primary block" onclick="authMode('register')">Crear perfil de prueba ${ico('arrow')}</button><button class="btn outline block" onclick="authMode('login')">Entrar con mi perfil</button><button class="link" style="padding:7px" onclick="guest()">Explorar demo sin registrarme</button><p class="muted" style="text-align:center;font-size:10px;margin:0">Demo: no se envían datos a un servidor ni se procesan pagos.</p></div></div>`}
function authMode(mode){S.auth=mode;go('auth')}function guest(){data.session=true;save();go('home')}
function auth(){return `<div class="authwrap">${logo(205)}${head(S.auth==='register'?'Crea tu perfil':'Bienvenido de nuevo')}<p class="sub">${S.auth==='register'?'Una sola cuenta para contratar servicios y ofrecer tu trabajo.':'En esta demo tu perfil se guarda únicamente en este dispositivo.'}</p><form onsubmit="enterDemo(event)"><div class="field"><label class="label" for="regname">Tu nombre</label><input class="control" id="regname" autocomplete="name" required value="${e(data.account.name)}" placeholder="Nombre completo"></div><div class="field"><label class="label" for="regemail">Correo (opcional)</label><input class="control" type="email" id="regemail" autocomplete="email" value="${e(data.account.email)}" placeholder="tu@correo.com"></div><div class="field"><label class="label" for="regcity">Ciudad</label><select class="control" id="regcity">${cityOptions(data.account.city)}</select></div><button type="submit" class="btn primary block">${S.auth==='register'?'Crear perfil y comenzar':'Entrar a CHAMBEA'} ${ico('arrow')}</button></form><p class="sub" style="font-size:11px;margin-top:22px">Esta versión no solicita contraseña ni ofrece cuentas reales. Los datos se guardan localmente para que explores los flujos.</p></div>`}
function enterDemo(ev){ev.preventDefault();data.account.name=$('#regname').value.trim();data.account.email=$('#regemail').value.trim();data.account.city=$('#regcity').value;data.session=true;save();S.previous=[];S.page='home';render();toast('Tu perfil de prueba está listo')}
function cityOptions(sel){return ['Guadalajara','Zapopan','Tlajomulco','Tlaquepaque','Tonalá'].map(x=>`<option ${sel===x?'selected':''}>${x}</option>`).join('')}
function catTiles(){return `<div class="tilegrid">${CATS.map(([name,icon])=>`<button class="tile" onclick="go('category',${A(name)})"><div class="graphic">${ico(icon)}</div><span>${name}</span></button>`).join('')}</div>`}
function searchBox(val=''){return `<div class="search">${ico('search')}<input type="search" id="query" value="${e(val)}" placeholder="Buscar servicio, oficio o problema" oninput="searchChanged(this.value)" aria-label="Buscar servicio"></div>`}
function searchChanged(v){S.search=v;const target=$('#searchResults');if(target)target.innerHTML=listPros(filterPros())}
function filterPros(){const q=S.search.trim().toLocaleLowerCase('es');return PROS.filter(p=>[p.name,p.skill,p.city,...p.tags].join(' ').toLocaleLowerCase('es').includes(q)&&(S.filter==='Todas'||p.skill===S.filter)&&(S.filterCity==='Todas'||p.city===S.filterCity))}
function home(){return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Hola, ${e((data.account.name||'bienvenido').split(' ')[0])}</h1><p style="margin:4px 0 17px;color:#647789">${ico('pin','inlineicon')} ${e(data.account.city)}, Jalisco</p><div onclick="go('explore')">${searchBox()}</div><div class="hero-banner"><div class="copy"><h2>Encuentra<br><span class="orange">expertos</span> cerca de ti</h2><p>Plomería, pintura, electricidad y más para tu hogar.</p><button class="btn primary small" onclick="go('explore')">Explorar ${ico('arrow')}</button></div></div>${section('Categorías de servicios',`<button class="link" onclick="go('explore')">Ver todas →</button>`)}${catTiles()}${section('Profesionales destacados',`<button class="link" onclick="go('explore')">Ver todos →</button>`)}<div class="cardsrow">${PROS.slice(0,2).map(personSmall).join('')}</div><div style="margin-top:19px" class="panel"><div class="between" style="padding:15px"><div><strong style="font-size:14px">¿Tienes un trabajo por hacer?</strong><p class="sub" style="margin:6px 0 0">Descríbelo y compara propuestas.</p></div><button class="btn primary small" onclick="go('post')">Publicar ${ico('arrow')}</button></div></div><p class="sub" style="font-size:10px;margin-top:16px">Perfiles y calificaciones ilustrativos de la demo.</p></div>`}
function personSmall(p){return `<div class="person-card"><img class="photo" src="${p.photo}" alt="Perfil ilustrativo de ${p.name}"><div class="desc"><strong>${p.name}</strong><span><b class="stars">★</b> ${p.rating} · ${p.reviews} reseñas*</span><span>${e(p.skill)}</span><span>${e(p.city)}</span><button class="btn primary small" onclick="go('provider','${p.id}')">Ver perfil →</button></div></div>`}
function explore(){return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Explorar servicios</h1><p class="sub" style="margin:0 0 15px">Encuentra soluciones para tu hogar.</p>${searchBox(S.search)}<div class="choice" style="margin:12px 0 18px"><button class="${S.filter==='Todas'?'on':''}" onclick="setFilter('Todas')">Todos</button><button class="${S.filter==='Plomería'?'on':''}" onclick="setFilter('Plomería')">Plomería</button><button class="${S.filter==='Pintura'?'on':''}" onclick="setFilter('Pintura')">Pintura</button><button class="${S.filter==='Aire acondicionado'?'on':''}" onclick="setFilter('Aire acondicionado')">Aire acondicionado</button></div>${section('Categorías',`<span class="muted" style="font-size:11px">8 oficios</span>`)}${catTiles()}${section('Profesionales',`<span class="muted" style="font-size:11px">Ejemplos</span>`)}<div id="searchResults">${listPros(filterPros())}</div></div>`}
function setFilter(f){S.filter=f;render()}
function listPros(arr){return arr.length?`<div class="pro-list">${arr.map(proCard).join('')}</div>`:`<div class="empty">${ico('search')}<h3>Sin resultados de ejemplo</h3><p>Prueba otra búsqueda o categoría.</p><button class="btn outline small" onclick="S.search='';S.filter='Todas';go('explore')">Ver todos</button></div>`}
function proCard(p){return `<div class="pro-card"><img class="photo" src="${p.photo}" alt="Perfil de ejemplo"><div><h3>${p.name}</h3><p><b class="stars">★</b> ${p.rating} <span class="muted">(${p.reviews} reseñas de ejemplo)</span></p><p>${ico('wrench','inlineicon')} ${p.skill}</p><p>${ico('pin','inlineicon')} ${p.city}, Jal.</p><div class="tagrow">${p.tags.slice(0,2).map(t=>`<span class="tag">${t}</span>`).join('')}</div><button class="btn primary small" onclick="go('provider','${p.id}')">Ver perfil ${ico('arrow')}</button></div><button class="btn-icon hearts ${data.favorites.includes(p.id)?'active':''}" aria-label="Guardar favorito" onclick="favorite('${p.id}')">${ico('heart')}</button></div>`}
function favorite(id){if(data.favorites.includes(id))data.favorites=data.favorites.filter(x=>x!==id);else data.favorites.push(id);save();render();toast(data.favorites.includes(id)?'Guardado en favoritos':'Eliminado de favoritos')}
function category(){const cat=S.cat||'Plomería';const related=PROS.filter(p=>p.skill===cat);const catico=CATS.find(x=>x[0]===cat)?.[1]||'wrench';return `${topbar()}<div class="area" style="padding-top:15px">${head(cat)}<div class="service-hero"><div class="text"><h1>Soluciones de <span class="orange">${e(cat.toLowerCase())}</span> para tu hogar</h1><p>Describe lo que necesitas y consulta profesionales y cotizaciones.</p></div></div><div class="info-trio"><div>${ico('file')}<strong>Solicita una cotización</strong></div><div>${ico('calendar')}<strong>Elige tu fecha</strong></div><div>${ico('chat')}<strong>Compara propuestas</strong></div></div>${section('Cómo funciona')}<div class="squares"><div>${ico('file','inlineicon')}<strong>1</strong><small>Publica lo que necesitas</small></div><div>${ico('chat','inlineicon')}<strong>2</strong><small>Revisa propuestas</small></div><div>${ico('check','inlineicon')}<strong>3</strong><small>Elige profesional</small></div></div>${section('Profesionales de ejemplo')} ${listPros(related.length?related:PROS)}<button class="btn primary block" style="margin-top:16px" onclick="startPost('${e(cat)}')">Solicitar cotización ${ico('arrow')}</button></div>`}
function provider(){const p=PROS.find(x=>x.id===S.pro)||PROS[0];return `<div class="pro-hero"><button class="headbutton" style="position:absolute;top:20px;left:18px;z-index:2" onclick="back()">${ico('back')}</button><div class="overlay"><h1>${p.name}</h1><p><span class="stars">★ ${p.rating}</span> · ${p.reviews} reseñas de ejemplo</p><p>${ico('wrench','inlineicon')} ${p.skill}</p><p>${ico('pin','inlineicon')} ${p.city}, Jalisco</p></div></div><div class="area" style="padding-top:2px"><div class="squares"><div><strong>${p.experience} años</strong><small>Experiencia ilustrativa</small></div><div><strong>${p.rating}</strong><small>Calificación de ejemplo</small></div><div><strong>${p.city}</strong><small>Zona</small></div></div>${section('Acerca de mí')}<p class="sub">${p.bio}</p>${section('Especialidades')}<div class="tagrow">${p.tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div>${section('Portafolio de ejemplo')}<div class="gallery"><div>${ico('tap')}</div><div>${ico('wrench')}</div><div>${ico('home')}</div></div><p class="sub" style="font-size:11px">Las fotos y reseñas de este perfil no representan a una persona contratada o verificada.</p><div class="grid2" style="margin:18px 0"><button class="btn outline block" onclick="favorite('${p.id}')">${ico('heart')} ${data.favorites.includes(p.id)?'Guardado':'Guardar'}</button><button class="btn primary block" onclick="startPost('${p.skill}','${p.id}')">Cotizar ${ico('arrow')}</button></div></div>`}
function startPost(cat='Plomería',target=null){S.cat=cat;S.postTarget=target;go('post')}
function post(){return `${topbar()}<div class="area" style="padding-top:13px">${head('Publicar trabajo')}<h1 class="headline">Cuéntanos qué necesitas</h1><p class="sub">Describe tu proyecto para recibir propuestas en esta simulación.</p><div class="steps">${[1,2,3].map(i=>`<div class="${i<=S.step?'active':''}"></div>`).join('')}</div><form id="postform" onsubmit="submitPost(event)"><div class="field"><label class="label" for="service">Servicio</label><select class="control" id="service">${CATS.map(([x])=>`<option ${S.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label" for="description">¿Qué trabajo necesitas?</label><textarea class="control" id="description" required minlength="10" placeholder="Ej. Necesito pintar la sala y dos habitaciones..."></textarea></div><div class="grid2"><div class="field"><label class="label" for="locality">Ciudad</label><select class="control" id="locality">${cityOptions(data.account.city)}</select></div><div class="field"><label class="label" for="date">Fecha preferida</label><input class="control" id="date" type="date" min="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><span class="label">¿Incluye materiales?</span><div class="choice"><button type="button" class="on" id="labor" onclick="materials(false)">Solo mano de obra</button><button type="button" id="withmaterials" onclick="materials(true)">Con materiales</button></div><input id="materials" type="hidden" value="no"></div><div class="field"><label class="label" for="budget">Presupuesto aproximado en MXN (opcional)</label><input class="control" id="budget" type="number" inputmode="numeric" min="0" placeholder="Ej. 3500"></div><div class="field"><span class="label">Fotos del trabajo (opcional)</span><label class="upload">${ico('camera','inlineicon')} Adjuntar fotografías<input type="file" accept="image/*" multiple onchange="photos(event)"></label><div class="previews" id="previews">${S.photo.map(s=>`<img src="${s}" alt="Foto del trabajo">`).join('')}</div></div><div class="notice">En esta demo la solicitud se guarda en tu dispositivo. No se publica en un mercado real.</div><button type="submit" class="btn primary block" style="margin-top:18px">Publicar solicitud de prueba ${ico('arrow')}</button></form></div>`}
function materials(on){$('#materials').value=on?'si':'no';$('#labor').classList.toggle('on',!on);$('#withmaterials').classList.toggle('on',on)}
async function photos(ev){const a=Array.from(ev.target.files||[]).slice(0,3);S.photo=[];for(const f of a){try{const image=await createImageBitmap(f);let can=document.createElement('canvas');let scale=Math.min(1,560/Math.max(image.width,image.height));can.width=Math.round(image.width*scale);can.height=Math.round(image.height*scale);can.getContext('2d').drawImage(image,0,0,can.width,can.height);S.photo.push(can.toDataURL('image/jpeg',.65))}catch{}}$('#previews').innerHTML=S.photo.map(s=>`<img src="${s}" alt="Foto adjunta">`).join('')}
function submitPost(ev){ev.preventDefault();const desc=$('#description').value.trim();if(desc.length<10){toast('Describe el trabajo con más detalle.');return}const id=Date.now();const j={id,cat:$('#service').value,desc,city:$('#locality').value,date:$('#date').value||'',materials:$('#materials').value==='si',budget:Number($('#budget').value)||0,photos:S.photo.slice(),offers:[],accepted:null,status:'publicado',mine:true,target:S.postTarget,created:Date.now()};data.jobs.unshift(j);S.photo=[];save();S.previous=[];S.jobid=id;S.page='job';render();toast('Trabajo guardado en esta demo')}
function getJob(id=S.jobid){return data.jobs.find(x=>String(x.id)===String(id))}function sampleJobs(){return [{id:'demo-a',cat:'Plomería',desc:'Reparación de fuga en llave de baño.',city:'Zapopan',budget:900,materials:false,mine:false,status:'publicado',offers:[],created:Date.now()-3600000},{id:'demo-b',cat:'Pintura',desc:'Pintura de pared interior de sala, aproximadamente 20 m².',city:'Tlaquepaque',budget:2000,materials:true,mine:false,status:'publicado',offers:[],created:Date.now()-7200000}]}
function demoJobCard(j){return `<div class="request-card"><div class="between"><h3>${e(j.cat)}</h3><span class="badge ${j.status==='finalizado'?'':'neutral'}">${status(j.status)}</span></div><p>${e(j.desc)}</p><p>${ico('pin','inlineicon')} ${e(j.city)} · ${j.budget?fmt(j.budget):'Sin presupuesto'}</p><div class="between" style="margin-top:10px"><span class="sub" style="font-size:11px">${j.offers?.length||0} propuesta(s)</span><button class="btn primary small" onclick="go('job',${A(j.id)})">Ver detalle ${ico('arrow')}</button></div></div>`}
function status(s){return ({publicado:'Recibiendo propuestas',aceptado:'Cotización aceptada',programado:'Programado',camino:'En camino',finalizado:'Finalizado'})[s]||'En proceso'}
function jobs(){return `${topbar()}<div class="area" style="padding-top:13px"><div class="between"><h1 class="headline">Mis solicitudes</h1><button class="btn primary small" onclick="startPost()">${ico('plus')} Nueva</button></div><p class="sub">Consulta los trabajos que publicaste y sus cotizaciones.</p><div class="stack" style="margin-top:18px">${data.jobs.filter(x=>x.mine).length?data.jobs.filter(x=>x.mine).map(demoJobCard).join(''):`<div class="empty">${ico('file')}<h3>Aún no publicas trabajos</h3><p>Publica una solicitud y después prueba cómo recibe cotizaciones desde la vista del profesional.</p><button class="btn primary" onclick="startPost()">Publicar mi primer trabajo</button></div>`}</div></div>`}
function job(){const j=getJob();if(!j)return `${topbar()}<div class="area">${head('Solicitud')}<p>Solicitud no encontrada.</p></div>`;return `${topbar()}<div class="area" style="padding-top:13px">${head('Detalle de solicitud')}<div class="request-card"><div class="between"><h2 style="margin:0;font-size:20px">${e(j.cat)}</h2><span class="badge">${status(j.status)}</span></div><p style="font-size:13px;margin:13px 0">${e(j.desc)}</p><div class="separator"></div><p>${ico('pin','inlineicon')} ${e(j.city)} · ${j.date?e(j.date):'Fecha flexible'}</p><p>${ico('briefcase','inlineicon')} ${j.materials?'Con materiales':'Solo mano de obra'}</p><p>${ico('money','inlineicon')} ${j.budget?fmt(j.budget):'Sin presupuesto definido'}</p>${j.photos?.length?`<div class="previews">${j.photos.map(f=>`<img src="${f}" alt="Foto del trabajo">`).join('')}</div>`:''}</div><div class="stack" style="margin-top:14px"><button class="btn primary block" onclick="go('quotes',${A(j.id)})">${ico('file')} Ver cotizaciones (${j.offers?.length||0})</button>${!j.offers?.length?`<button class="btn pale block" onclick="simulateQuotes(${A(j.id)})">${ico('sparkle')} Generar cotizaciones de ejemplo</button>`:''}${j.accepted!==null?`<button class="btn outline block" onclick="go('tracking',${A(j.id)})">${ico('calendar')} Seguimiento del servicio</button>`:''}</div><div class="notice" style="margin-top:17px">Todas las propuestas son ficticias hasta que se conecte la aplicación con profesionales reales.</div></div>`}
function simulateQuotes(id){const j=getJob(id);if(!j)return;const base=j.budget||2400;const matches=PROS.filter(x=>x.skill===j.cat),p=matches.length?[...matches,...PROS.filter(x=>x.skill!==j.cat)].slice(0,3):PROS;const amounts=[base*.95,base*1.12,base*.85];j.offers=p.map((x,i)=>({id:'o-'+x.id+'-'+Date.now(),pro:x.id,name:x.name,price:Math.max(300,Math.round(amounts[i]/50)*50),message:['Incluye preparación del área y trabajo acordado.','Puedo realizar una visita para definir el alcance.','Cotización inicial sujeta a visita y materiales.'][i],demo:true}));save();go('quotes',id);toast('Se generaron 3 cotizaciones ficticias')}
function quotes(){const j=getJob();if(!j)return '';return `${topbar()}<div class="area" style="padding-top:13px">${head('Cotizaciones recibidas')}<h1 class="headline">Compara propuestas</h1><p class="sub" style="margin-bottom:14px">${e(j.cat)} · ${e(j.city)} · ${j.offers.length} propuesta(s)</p><div class="stack">${j.offers.length?j.offers.map((o,i)=>quoteCard(j,o,i)).join(''):`<div class="empty">${ico('file')}<h3>Todavía no hay propuestas</h3><p>Desde la vista del profesional puedes enviar una cotización a este trabajo.</p><button class="btn primary small" onclick="simulateQuotes(${A(j.id)})">Ver 3 cotizaciones de ejemplo</button></div>`}</div></div>`}

function acceptQuote(id,i){const j=getJob(id);j.accepted=i;j.status='aceptado';save();go('tracking',id);toast('Cotización aceptada en la simulación')}
function tracking(){const j=getJob();if(!j)return '';const o=j.offers[j.accepted];const stages=['aceptado','programado','camino','finalizado'];let n=Math.max(0,stages.indexOf(j.status));return `${topbar()}<div class="area" style="padding-top:13px">${head('Seguimiento del servicio')}<h1 class="headline">Tu trabajo, paso a paso</h1><p class="sub">${e(j.cat)} · ${e(j.city)}</p><div class="panel" style="padding:17px;margin:17px 0"><div class="track">${['Cotización aceptada','Programado','En camino','Finalizado'].map((x,i)=>`<div class="point ${i<=n?'done':''}"><div class="dot">${i<=n?ico('check','inlineicon'):i+1}</div><small>${x}</small></div>`).join('')}</div></div><div class="quote-card"><div class="between"><div><h3>Profesional asignado</h3><p>${e(o?.name||'Por confirmar')}</p></div><span class="badge">${status(j.status)}</span></div><p>${e(j.desc)}</p><button class="btn outline block" onclick="openChat(${A(j.id)},${j.accepted})">${ico('chat')} Abrir mensajes</button></div><div class="stack" style="margin-top:15px"><div class="notice">Para probar el seguimiento, cambia manualmente el estado. No existe geolocalización en tiempo real en esta demo.</div>${n<3?`<button class="btn primary block" onclick="nextStatus(${A(j.id)})">Avanzar al siguiente estado ${ico('arrow')}</button>`:`<div class="badge">${ico('check','inlineicon')} Trabajo marcado como finalizado</div>`}</div></div>`}
function nextStatus(id){const j=getJob(id),a=['aceptado','programado','camino','finalizado'];j.status=a[Math.min(3,a.indexOf(j.status)+1)];save();render();toast('Estado actualizado en la demo')}
function openChat(id,idx){S.chat={id,idx};go('chat',S.chat)}function threadKey(id,i){return String(id)+'-'+String(i)}
function threads(){let out=[];for(const j of data.jobs){for(let i=0;i<(j.offers||[]).length;i++){let o=j.offers[i];out.push({job:j,o,i,key:threadKey(j.id,i),messages:data.messages[threadKey(j.id,i)]||[]})}}return out}
function messages(){const all=threads();return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Mensajes</h1><p class="sub">Conversaciones dentro de esta demo. No se envían mensajes reales.</p>${all.length?`<div class="stack" style="margin-top:18px">${all.map(t=>`<button style="width:100%;text-align:left;border:none;background:transparent;padding:0" onclick="openChat(${A(t.job.id)},${t.i})"><div class="request-card"><div class="between"><strong>${e(t.o.name)}</strong><span class="badge neutral">${e(t.job.cat)}</span></div><p>${e(t.messages.at(-1)?.text||'Abre el chat para iniciar una conversación de prueba.')}</p></div></button>`).join('')}</div>`:`<div class="empty" style="margin-top:18px">${ico('chat')}<h3>Sin conversaciones</h3><p>Publica un trabajo, genera o recibe cotizaciones y abre el chat de una propuesta.</p><button class="btn primary" onclick="go('jobs')">Mis solicitudes</button></div>`}</div>`}
function chat(){const t=S.chat||{id:S.jobid,idx:0};const j=getJob(t.id);if(!j)return `${topbar()}<div class="area">${head('Mensajes')}<p>Sin conversación.</p></div>`;const o=j.offers[t.idx];if(!o)return '';const key=threadKey(j.id,t.idx);const a=data.messages[key]||[];return `${topbar()}<div class="area" style="padding-top:13px">${head('Chat · '+o.name)}<p class="sub" style="margin-top:-5px">${e(j.cat)} · ${e(j.city)} · Mensajes guardados localmente</p><div class="panel" style="padding:13px;margin:14px 0"><strong>${e(o.name)}</strong> <span class="muted" style="font-size:11px">· Propuesta ${fmt(o.price)}</span></div><div class="stack" style="min-height:38dvh;align-content:start">${a.length?a.map(m=>`<div class="bubble ${m.mine?'mine':''}">${e(m.text)}<div style="font-size:9px;color:#8b999f;margin-top:5px">${e(m.at)}</div></div>`).join(''):`<div class="bubble">Hola. Este es un chat de prueba para hablar sobre tu solicitud de ${e(j.cat.toLowerCase())}.</div>`}</div><form class="chatbox" onsubmit="sendMessage(event,${A(j.id)},${t.idx})"><input class="control" id="msg" required maxlength="400" placeholder="Escribe un mensaje..."><button type="submit" class="btn primary">${ico('send')}</button></form></div>`}
function sendMessage(ev,id,i){ev.preventDefault();const text=$('#msg').value.trim();if(!text)return;const key=threadKey(id,i);if(!data.messages[key])data.messages[key]=[];data.messages[key].push({text,mine:data.mode==='cliente',at:new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})});save();render();window.scrollTo(0,document.body.scrollHeight)}
function profile(){return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Mi perfil</h1><p class="sub">Una cuenta para contratar y ofrecer servicios.</p><div class="switch" style="margin:18px 0"><button class="${data.mode==='cliente'?'on':''}" onclick="navigateMode('cliente')">Quiero contratar</button><button class="${data.mode==='profesional'?'on':''}" onclick="navigateMode('profesional')">Ofrezco servicios</button></div><form onsubmit="saveMyProfile(event)"><div class="field"><label class="label">Nombre</label><input class="control" id="name" required value="${e(data.account.name)}" placeholder="Tu nombre"></div><div class="field"><label class="label">Correo (opcional)</label><input class="control" id="email" type="email" value="${e(data.account.email)}" placeholder="Correo electrónico"></div><div class="field"><label class="label">Ciudad</label><select class="control" id="mycity">${cityOptions(data.account.city)}</select></div>${data.mode==='profesional'?`<div class="field"><label class="label">Especialidad</label><select class="control" id="myskill">${CATS.map(([x])=>`<option ${data.account.specialty===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label class="label">Sobre tu trabajo</label><textarea class="control" id="mybio" placeholder="Cuéntanos lo que sabes hacer...">${e(data.account.bio)}</textarea></div>`:''}<button type="submit" class="btn primary block">Guardar cambios</button></form><div class="separator"></div><div class="stack"><button class="btn outline block" onclick="go('wallet')">${ico('wallet')} Billetera (vista conceptual)</button><button class="btn pale block" onclick="resetDemo()">${ico('trash')} Reiniciar datos de prueba</button></div><p class="sub" style="font-size:11px;margin-top:15px">Sin autenticación real, verificación de identidad ni cobros. Los datos existen solo en este dispositivo.</p></div>`}
function saveMyProfile(ev){ev.preventDefault();data.account.name=$('#name').value.trim();data.account.email=$('#email').value.trim();data.account.city=$('#mycity').value;if($('#myskill'))data.account.specialty=$('#myskill').value;if($('#mybio'))data.account.bio=$('#mybio').value;save();toast('Perfil de prueba guardado');render()}
function resetDemo(){if(!confirm('¿Eliminar todas las solicitudes y mensajes de esta demo?'))return;data=JSON.parse(JSON.stringify(DEFAULT));save();S.previous=[];S.page='welcome';render();window.scrollTo(0,0)}
function proHome(){return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Hola, <span class="orange">${e((data.account.name||'profesional').split(' ')[0])}</span></h1><p class="sub" style="margin-top:4px">Tu espacio para encontrar trabajo y enviar propuestas.</p><div class="statrow" style="margin-top:17px"><div><div class="tiny">${ico('file','inlineicon')} Oportunidades</div><div class="big">${sampleJobs().length+data.jobs.filter(j=>j.mine&&j.status==='publicado').length}</div><div class="tiny">En esta demo</div></div><div style="background:#fff6ed"><div class="tiny">${ico('briefcase','inlineicon')} Mis propuestas</div><div class="big">${data.jobs.reduce((n,j)=>n+j.offers.filter(x=>x.pro==='local').length,0)}</div><div class="tiny">Enviadas</div></div><div style="background:#edf7fc"><div class="tiny">${ico('star','inlineicon')} Perfil</div><div class="big" style="font-size:18px">Demo</div><div class="tiny">Sin reseñas reales</div></div></div><div class="panel" style="padding:16px;margin-top:14px"><div class="between"><div><strong>Mi especialidad</strong><p class="sub" style="margin:4px 0">${e(data.account.specialty)}</p></div><button class="btn outline small" onclick="go('profile')">Editar perfil</button></div></div>${section('Nuevas solicitudes cerca de ti',`<button class="link" onclick="go('opportunities')">Ver todas →</button>`)}<div class="stack">${[...data.jobs.filter(j=>j.mine&&j.status==='publicado'),...sampleJobs()].slice(0,3).map(proOpp).join('')}</div><div class="notice" style="margin-top:17px">Puedes cotizar trabajos de esta demo. Nada se envía a clientes reales.</div></div>`}
function proOpp(j){return `<div class="request-card"><div class="between"><h3>${e(j.cat)}</h3><span class="badge neutral">${j.mine?'Publicada aquí':'Ejemplo'}</span></div><p>${ico('pin','inlineicon')} ${e(j.city)} · ${e(j.desc)}</p><div class="between"><strong>${j.budget?fmt(j.budget):'Presupuesto abierto'}</strong><button class="btn primary small" onclick="offerForm(${A(j.id)})">Cotizar ${ico('arrow')}</button></div></div>`}
function opportunities(){const j=[...data.jobs.filter(j=>j.mine&&j.status==='publicado'),...sampleJobs()];return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Oportunidades</h1><p class="sub">Trabajos publicados en tu dispositivo y solicitudes de ejemplo.</p><div class="stack" style="margin-top:16px">${j.map(proOpp).join('')}</div></div>`}
function offerForm(id){const j=getJob(id)||sampleJobs().find(x=>x.id===id);if(!j)return;S.jobid=id;S.offer=j;S.page='worklist';S.offerOpen=true;render();window.scrollTo(0,0)}
function sendOffer(ev){ev.preventDefault();let j=getJob(S.offer?.id);if(!j&&S.offer){j={...S.offer,offers:[],accepted:null};data.jobs.unshift(j)}const price=Number($('#offerPrice').value),message=$('#offerText').value.trim();if(price<=0){toast('Escribe un importe mayor a cero');return}if(!j){toast('No se encontró la solicitud.');return}j.offers.push({id:'local'+Date.now(),pro:'local',name:data.account.name||'Profesional de prueba',price,message:message||'Cotización de prueba',demo:false});save();S.offerOpen=false;S.offer=null;go('worklist');toast('Tu cotización ya aparece en la vista del cliente')}
function worklist(){const mine=data.jobs.flatMap(j=>(j.offers||[]).filter(x=>x.pro==='local').map(x=>({j,x})));return `${topbar()}<div class="area" style="padding-top:13px"><h1 class="headline">Mis trabajos</h1><p class="sub">Cotizaciones enviadas y trabajos en esta simulación.</p>${S.offerOpen?`<form class="panel" onsubmit="sendOffer(event)" style="padding:17px;margin:18px 0"><h3 style="margin:0">Cotizar: ${e(S.offer?.cat)}</h3><p class="sub">${e(S.offer?.desc)}</p><div class="field"><label class="label">Mi precio (MXN)</label><input class="control" type="number" id="offerPrice" min="1" required placeholder="Ej. 2800"></div><div class="field"><label class="label">Incluye / plazo / condiciones</label><textarea class="control" id="offerText" placeholder="Ej. Incluye mano de obra; duración estimada 2 días..."></textarea></div><button class="btn primary block" type="submit">Enviar propuesta de prueba</button><button class="btn outline block" style="margin-top:8px" type="button" onclick="S.offerOpen=false;render()">Cancelar</button></form>`:''}<div class="stack" style="margin-top:18px">${mine.length?mine.map(({j,x})=>`<div class="request-card"><div class="between"><h3>${e(j.cat)}</h3><span class="badge">${j.accepted!==null&&j.offers[j.accepted]?.id===x.id?'Aceptada':'Enviada'}</span></div><p>${e(j.desc)}</p><strong>${fmt(x.price)}</strong></div>`).join(''):`<div class="empty">${ico('briefcase')}<h3>Sin propuestas enviadas</h3><p>Entra a Solicitudes, elige un trabajo publicado en esta demo y prepara tu cotización.</p><button class="btn primary" onclick="go('opportunities')">Ver oportunidades</button></div>`}</div></div>`}
function wallet(){return `${topbar()}<div class="area" style="padding-top:13px">${head('Mi billetera')}<h1 class="headline">Pagos y ganancias</h1><p class="sub">Vista conceptual para una etapa futura de CHAMBEA.</p><div class="wallet" style="margin-top:20px"><small>Saldo real disponible</small><strong>$0.00</strong><small>Los pagos aún no están habilitados.</small></div>${section('Métodos de pago')}<div class="grid2"><div class="request-card"><strong>${ico('wallet','inlineicon')} Transferencia</strong><p>Próximamente</p></div><div class="request-card"><strong>${ico('money','inlineicon')} Efectivo</strong><p>Por definir</p></div></div><div class="notice" style="margin-top:19px">No existe integración bancaria, retiro de dinero ni cobros reales en esta versión. Esta pantalla únicamente muestra una propuesta de diseño.</div></div>`}
function notifications(){return `${topbar()}<div class="area" style="padding-top:13px">${head('Notificaciones')}<h1 class="headline">Actividad reciente</h1><div class="stack" style="margin-top:15px">${data.jobs.filter(x=>x.mine).flatMap(j=>[...(j.offers?.length?[`Tu solicitud de ${j.cat} tiene ${j.offers.length} cotización(es) de prueba.`]:[]),`Solicitud de ${j.cat} guardada en tu dispositivo.`]).map(t=>`<div class="request-card"><p>${e(t)}</p></div>`).join('')||`<div class="empty">${ico('bell')}<h3>Sin notificaciones</h3><p>Cuando publiques trabajos, verás su actividad aquí.</p></div>`}</div></div>`}
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.previous.length)back()});render();

</script><div id="cloudStatus" aria-live="polite" style="position:fixed;z-index:50;top:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#005450;color:#fff;text-align:center;padding:3px 10px;font:600 10px system-ui;pointer-events:none">Conectando Firebase...</div><script type="module" src="./interactions-v3.js"></script></body></html>
